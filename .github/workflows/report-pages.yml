name: Publish SOSC314 report

on:
  push:
    branches: [main]
    paths:
      - 'final_report/**'
      - '.github/workflows/report-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Verify reviewed report files
        run: python final_report/verify_release.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload report directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: final_report
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
