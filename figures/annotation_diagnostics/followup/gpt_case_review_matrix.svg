<text x="28" y="1038" font-size="12" text-anchor="start" fill="#182733">Selection groups overlap: added14 and model-disagreement14 share five cases; eight controls are non-target cases.</text>
<text x="28" y="1060" font-size="12" text-anchor="start" fill="#182733">Grey means invalid/skipped, not unhelpful. One GPT answer was uncertain. Read reasons and evidence before interpreting.</text>
